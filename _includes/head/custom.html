<!-- start custom head snippets -->
{% if page.robots_meta %}
<meta name="robots" content="{{ page.robots_meta | escape }}">
{% endif %}
{{ page.head_metadata }}
{% if page.collection == "posts" %}
<link rel="cite-as" href="{{ page.canonical_url | default: page.url | absolute_url }}">
<link rel="type" href="https://schema.org/BlogPosting">
<link rel="describedby" type="application/ld+json" profile="https://schema.org/" href="{{ page.url | append: 'metadata.json' | relative_url }}">
{% else %}
<link rel="describedby" type="application/ld+json" profile="https://schema.org/" href="{{ '/metadata.json' | relative_url }}">
{% endif %}
{% if site.standard_site.enabled %}
<link rel="alternate" type="application/json" title="Doctrine of Discovery Project Standard.site Publication" href="{{ '/standard.site/publication.json' | relative_url }}">
<link rel="alternate" type="application/json" title="Doctrine of Discovery Project Standard.site Documents" href="{{ '/standard.site/documents.json' | relative_url }}">
<link rel="alternate" type="application/json" title="Doctrine of Discovery Project Standard.site Manifest" href="{{ '/standard.site/manifest.json' | relative_url }}">
{% endif %}
<!-- ReCaptcha -->
{% if page.layout == "contact-form" %}<script src="https://www.google.com/recaptcha/api.js" async defer></script>{% endif %}
<!-- Favicons: generated with https://realfavicongenerator.net/ (2026-09-07) -->
<link rel="icon" type="image/png" sizes="96x96" href="/assets/images/favicons/favicon-96x96.png?v=20260907">
<link rel="icon" type="image/svg+xml" href="/assets/images/favicons/favicon.svg?v=20260907">
<link rel="shortcut icon" href="/assets/images/favicons/favicon.ico?v=20260907">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicons/apple-touch-icon.png?v=20260907">
<meta name="apple-mobile-web-app-title" content="Doctrine of Discovery">
<link rel="manifest" href="/assets/images/favicons/site.webmanifest?v=20260907">
<meta name="msapplication-TileColor" content="#a71e22">
<meta name="msapplication-config" content="/assets/images/favicons/browserconfig.xml?v=20260907">
<meta name="theme-color" content="#ffffff">
<!-- end custom head snippets -->
