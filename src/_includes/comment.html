<article id="comment{{ include_index }}" class="js-comment comment" itemprop="comment" itemscope itemtype="https://schema.org/Comment">
  <div class="comment__avatar-wrapper">
    <img class="comment__avatar" src="https://www.gravatar.com/avatar/{{ include_email }}?d=mm&s=80" alt="{{ include_name }}">
  </div>
  <div class="comment__content-wrapper">
    <h3 class="comment__author" itemprop="author" itemscope itemtype="https://schema.org/Person">
      {% unless include_url == blank %}
        <span itemprop="name"><a rel="external nofollow" itemprop="url" href="{{ include_url }}">{{ include_name }}</a></span>
      {% else %}
        <span itemprop="name">{{ include_name }}</span>
      {% endunless %}
    </h3>
    <p class="comment__date">
      {% if include_date %}
        {% if include_index %}<a href="#comment{{ include_index }}" itemprop="url">{% endif %}
        <time datetime="{{ include_date | date_to_xmlschema }}" itemprop="datePublished">{{ include_date | date: "%B %-d, %Y at %I:%M %p" }}</time>
        {% if include_index %}</a>{% endif %}
      {% endif %}
    </p>
    <div itemprop="text">{{ include_message | markdownify }}</div>
  </div>
</article>
